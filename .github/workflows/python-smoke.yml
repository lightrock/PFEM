      - run: PYTHONPATH=src python tools/pfem_custody_ledger_verification_receipts.py
      - run: PYTHONPATH=src python tools/pfem_custody_release_requests.py
      - run: PYTHONPATH=src python tools/pfem_custody_release_approvals.py
      - run: PYTHONPATH=src python tools/pfem_custody_release_receipts.py
      - run: PYTHONPATH=src python tools/pfem_custody_release_verification_receipts.py
      - run: PYTHONPATH=src python tools/pfem_custody_release_closeout_records.py
      - run: PYTHONPATH=src python tools/pfem_custody_release_chain_records.py
      - run: PYTHONPATH=src python tools/pfem_custody_release_chain_verification_receipts.py
