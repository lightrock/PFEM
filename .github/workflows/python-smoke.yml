name: Python smoke tests

on:
  push:
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python tools/pfem_catalog.py
      - run: PYTHONPATH=src python tools/pfem_sources.py
      - run: PYTHONPATH=src python tools/pfem_topology.py
      - run: PYTHONPATH=src python tools/pfem_handling.py
      - run: PYTHONPATH=src python tools/pfem_retention.py
      - run: PYTHONPATH=src python tools/pfem_quality.py
      - run: PYTHONPATH=src python tools/pfem_actions.py
      - run: PYTHONPATH=src python tools/pfem_playbooks.py
      - run: PYTHONPATH=src python tools/pfem_review.py
      - run: PYTHONPATH=src python tools/pfem_audit.py
      - run: PYTHONPATH=src python tools/pfem_bundles.py
      - run: PYTHONPATH=src python tools/pfem_exchange.py
      - run: PYTHONPATH=src python tools/pfem_reconciliation.py
      - run: PYTHONPATH=src python tools/pfem_schema_contracts.py
      - run: PYTHONPATH=src python tools/pfem_policy.py
      - run: PYTHONPATH=src python tools/pfem_lineage.py
      - run: PYTHONPATH=src python tools/pfem_rollup.py
      - run: PYTHONPATH=src python tools/pfem_integrity_update.py
      - run: PYTHONPATH=src python tools/pfem_integrity.py
      - run: PYTHONPATH=src python tools/pfem_doctor.py
      - run: PYTHONPATH=src python tools/pfem_smoke.py
      - run: PYTHONPATH=src python -m unittest discover -s tests/unit -p "test_*.py"
