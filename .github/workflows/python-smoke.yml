name: Python smoke tests

on:
  push:
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python tools/pfem_catalog.py
      - run: PYTHONPATH=src python tools/pfem_lineage.py
      - run: PYTHONPATH=src python tools/pfem_rollup.py
      - run: PYTHONPATH=src python tools/pfem_doctor.py
      - run: PYTHONPATH=src python tools/pfem_smoke.py
      - run: PYTHONPATH=src python -m unittest discover -s tests/unit -p "test_*.py"
