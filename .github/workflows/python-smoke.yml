name: Python smoke tests

on:
  push:
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python tools/pfem_catalog.py
      - run: PYTHONPATH=src python tools/pfem_sources.py
      - run: PYTHONPATH=src python tools/pfem_topology.py
      - run: PYTHONPATH=src python tools/pfem_dispatch.py
      - run: PYTHONPATH=src python tools/pfem_dispatch_decisions.py
      - run: PYTHONPATH=src python tools/pfem_outbox.py
      - run: PYTHONPATH=src python tools/pfem_inbox.py
      - run: PYTHONPATH=src python tools/pfem_intake_decisions.py
      - run: PYTHONPATH=src python tools/pfem_import_records.py
      - run: PYTHONPATH=src python tools/pfem_merge_decisions.py
      - run: PYTHONPATH=src python tools/pfem_conflict_records.py
      - run: PYTHONPATH=src python tools/pfem_apply_receipts.py
      - run: PYTHONPATH=src python tools/pfem_state_checkpoints.py
      - run: PYTHONPATH=src python tools/pfem_state_transitions.py
      - run: PYTHONPATH=src python tools/pfem_snapshot_manifests.py
      - run: PYTHONPATH=src python tools/pfem_snapshot_verification_receipts.py
      - run: PYTHONPATH=src python tools/pfem_recovery_points.py
      - run: PYTHONPATH=src python tools/pfem_restore_plans.py
      - run: PYTHONPATH=src python tools/pfem_restore_approvals.py
      - run: PYTHONPATH=src python tools/pfem_restore_receipts.py
      - run: PYTHONPATH=src python tools/pfem_restore_verification_receipts.py
      - run: PYTHONPATH=src python tools/pfem_restore_closeout_records.py
      - run: PYTHONPATH=src python tools/pfem_disposition_records.py
      - run: PYTHONPATH=src python tools/pfem_disposition_receipts.py
      - run: PYTHONPATH=src python tools/pfem_custody_records.py
      - run: PYTHONPATH=src python tools/pfem_custody_verification_receipts.py
      - run: PYTHONPATH=src python tools/pfem_custody_transfer_records.py
